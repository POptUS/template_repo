#
# Setup and manage python virtual environments that allow users to work
# globally with a set of coverage results each acquired individually.
#
# This tox.ini is explicitly setup in the root of the repository and saves the
# aggerate coverage result to the root as .coverage.  This is done so that
# Coveralls
#   * finds the report,
#   * shows correctly the filenames of python files inside (i.e., within the
#     mytemplate_pypkg directory) and outside (e.g., within subA) of the python
#     package, and
#   * allows users to view the coverage results for each python file inside and
#     outside of the python package.
# This extra care is needed as a result of developing subpackages such as subA
# outside of the python package and including it into the package via symlink.
#

[tox]
requires = tox>=4
env_list =

[testenv]
basepython = py3
skip_install = true
setenv =
    COVERAGE_FILE    = .coverage 
    MYTEMPLATE_PATH  = {toxinidir}/mytemplate_pypkg
    MYTEMPLATE2_PATH = {toxinidir}/mytemplate2_pypkg
    BOOK_ROOT        = {toxinidir}/book

[testenv:aggregate]
description = Aggregate all given coverage results into single file
deps = coverage
commands = coverage combine --keep --data-file={env:COVERAGE_FILE} {posargs}

[testenv:report]
# Unless an individual coverage report was saved to COVERAGE_FILE, this should fail
# if you don't run aggregate first
description = Generate reports for aggregated coverage results
deps = coverage
depends = aggregate
commands = 
    coverage report --data-file={env:COVERAGE_FILE}
    coverage html --data-file={env:COVERAGE_FILE}

[testenv:coveralls]
# Unless an individual coverage report was saved to COVERAGE_FILE, this should fail
# if you don't run aggregate first
description = Post aggregated coverage results to coveralls via GitHub Action
passenv = GITHUB_*, COVERALLS_*
deps = coveralls
depends = aggregate
commands = 
    coveralls --service=github --basedir={toxindir}
    coveralls --finish

[testenv:book]
# I have seen errors, such as the inability to run a cell within the allotted
# time, be reported as an error in stdout but treated as a warning in terms of
# the exit code.  In addition, caching of intermediate results with warnings
# leads to those same warnings not being shown after the initial build.
# Therefore, errors masquerading as "warnings" can be hidden if not dealt with
# immediately.  The flags used here are to to manage those difficulties.
description = Generate Jupyter book
deps =
    --editable=file://{env:MYTEMPLATE_PATH}
    --editable=file://{env:MYTEMPLATE2_PATH}
    sphinx-proof
    jupyter-book
commands = jupyter-book build --all --warningiserror {env:BOOK_ROOT}

[testenv:bookdev]
description = Generate Jupyter book
deps =
    --editable=file://{env:MYTEMPLATE_PATH}
    --editable=file://{env:MYTEMPLATE2_PATH}
    sphinx-proof
    jupyter-book
commands = jupyter-book build {env:BOOK_ROOT}
